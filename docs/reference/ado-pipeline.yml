# Illustrative Azure DevOps pipeline — fabric-ops, 2026-11-11. Not runnable from this repo.
#
# Assumptions, all true in the work repo first: Azure Repos in the same ADO organisation as the dev
# workspace's Git integration (ADR 0005); self-hosted Linux agents; two federated connections with no
# secret (ADR 0002) — sc-fabric-admin -> sp-fabric-admin (roles only) and sc-fabric-deploy ->
# sp-fabric-deploy (items only); approval on the ADO Environment `fabric-sales-forecast-prod` with
# dev/test unchecked; Terraform state in Azure Storage, one key per environment. Deploy stages are
# written once and expanded at compile time: the three `deployOrder` entries ARE DeployDev,
# DeployTest and DeployProd, chained in order.

trigger: { branches: { include: [main] } }
pool: { name: fabric-self-hosted }
variables:
  tfDir: terraform

parameters:
  - name: deployOrder
    type: object
    default:
      - { stage: DeployDev,  env: dev,  varFile: dev,  dependsOn: Build }
      - { stage: DeployTest, env: test, varFile: test, dependsOn: DeployDev }
      - { stage: DeployProd, env: prod, varFile: prod, dependsOn: DeployTest }

stages:
  - stage: Build # no identity, no backend: nothing here can reach the tenant
    jobs:
      - job: Validate
        steps:
          - checkout: self
          - script: terraform -chdir=$(tfDir) fmt -check -recursive
            displayName: terraform fmt
          - script: |
              terraform -chdir=$(tfDir) init -backend=false
              terraform -chdir=$(tfDir) validate
            displayName: terraform validate (no backend, no credentials)
          # VERIFY: fabric-cicd has no documented validate/dry-run mode; this checks our YAML only.
          - script: python scripts/preflight.py --check-parameter-file config/parameter.yml

  - ${{ each e in parameters.deployOrder }}:
      - stage: ${{ e.stage }}
        dependsOn: ${{ e.dependsOn }}
        jobs:
          - deployment: ${{ e.env }}
            environment: fabric-sales-forecast-${{ e.env }} # prod's approval check lives here
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self # control plane first: the workspace must exist (ADR 0003)
                    - task: AzureCLI@2
                      displayName: terraform apply — ${{ e.env }}
                      inputs:
                        azureSubscription: sc-fabric-admin
                        scriptType: bash
                        addSpnToEnvironment: true
                        script: |
                          # Federated: the assertion comes from the connection, not a secret.
                          export ARM_USE_OIDC=true ARM_CLIENT_ID=$servicePrincipalId
                          export ARM_TENANT_ID=$tenantId ARM_OIDC_TOKEN=$idToken
                          terraform -chdir=$(tfDir) init \
                            -backend-config="key=fabric-sales-forecast/${{ e.env }}.tfstate"
                          terraform -chdir=$(tfDir) apply -auto-approve -var-file=env/${{ e.varFile }}.tfvars
                    - task: AzureCLI@2
                      displayName: fabric-cicd publish — ${{ e.env }}
                      inputs:
                        azureSubscription: sc-fabric-deploy
                        scriptType: bash
                        addSpnToEnvironment: true
                        script: |
                          # deploy_items.py builds an azure-identity credential from $servicePrincipalId,
                          # $tenantId, $idToken and passes it to FabricWorkspace(token_credential=...).
                          # VERIFY: accepted credential types, and whether a federated assertion works
                          # directly — fabric-cicd authentication docs; and orphan removal
                          # (unpublish_all_orphan_items) before prod relies on it.
                          # No commit diff: every item redeploys, so a portal edit is overwritten (0003, 0005).
                          python scripts/deploy_items.py --environment ${{ e.env }} \
                            --content-dir content --parameter-file config/parameter.yml \
                            --workspace-name fabric-sales-forecast-${{ e.env }}
