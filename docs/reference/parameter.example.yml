# Illustrative fabric-cicd parameter.yml — fabric-ops, 2026-11-11. One environment per invocation.

# VERIFY: the top-level key, the find_value/replace_value/is_regex spelling, and whether
# $workspaces.* / $items.* are accepted inside replace_value — check the fabric-cicd
# parameterisation docs. This follows documented concepts, not a file I have seen.

find_replace:
  # The dev workspace's ID. Definitions committed out of the dev workspace carry it verbatim.
  - find_value: "11111111-1111-1111-1111-111111111111" # PLACEHOLDER dev workspace ID
    replace_value:
      dev: "11111111-1111-1111-1111-111111111111"
      test: "22222222-2222-2222-2222-222222222222"
      prod: "33333333-3333-3333-3333-333333333333"
    is_regex: "false"

  # The dev lakehouse's ID, referenced by the notebook and the semantic model.
  # VERIFY: that $items.<Type>.<Name>.id resolves during the same run — if the lakehouse is
  # created by this deploy, ordering matters.
  - find_value: "44444444-4444-4444-4444-444444444444" # PLACEHOLDER dev lakehouse ID
    replace_value:
      dev: "$items.Lakehouse.Sales Lakehouse.id"
      test: "$items.Lakehouse.Sales Lakehouse.id"
      prod: "$items.Lakehouse.Sales Lakehouse.id"
    is_regex: "false"

# The keys dev/test/prod must match the environment passed to FabricWorkspace(environment=...) in
# scripts/deploy_items.py. A typo is not an error: the value is left unsubstituted and the item
# deploys pointing at dev, with no warning.

# NEVER commit: a client secret, PAT or storage key (credentials are federated service connections,
# and a parameter file is not a secret store); real tenant, capacity, workspace, group or principal
# IDs where a placeholder will do; a connection string or SQL password, which find_replace would
# copy into every environment's definition.
